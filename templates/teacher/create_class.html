{% extends 'teacher/base.html' %}

{% block content %}
<div class="container my-5">
    <div class="card border-0 shadow-lg rounded-4 p-4">
        <div class="card-body">
            <h2 class="mb-4 fw-bold text-center text-primary">📚 Create New Class</h2>
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="class_name" class="form-label fw-semibold">Class Name</label>
                    <input type="text" class="form-control" id="class_name" name="class_name" placeholder="Enter class name" required>
                </div>

                <div class="mb-3">
                    <label for="subject" class="form-label fw-semibold">Subject</label>
                    <input type="text" class="form-control" id="subject" name="subject" placeholder="Enter subject" required>
                </div>

                <div class="mb-3">
                    <label for="class_key" class="form-label fw-semibold">Class Key</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="class_key" name="class_key" readonly>
                        <button class="btn btn-outline-primary" type="button" onclick="generateClassKey()">Generate</button>
                    </div>
                    <small class="form-text text-muted">Click to generate a 10-digit unique class key.</small>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5" placeholder="Describe the class"></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-outline-secondary px-4" onclick="window.history.back()">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Add Class</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .card {
        background: #ffffff;
    }

    .form-control {
        border-radius: 10px;
        padding: 10px 14px;
        border: 1px solid #d1d5db;
    }

    .form-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.25);
    }

    .form-label {
        color: #374151;
    }

    .btn-primary {
        background: #2563eb;
        border: none;
        border-radius: 10px;
        transition: 0.3s;
    }

    .btn-primary:hover {
        background: #1e40af;
        transform: translateY(-2px);
    }

    .btn-outline-primary {
        border-radius: 10px;
        border: 1px solid #2563eb;
        color: #2563eb;
        transition: 0.3s;
    }

    .btn-outline-primary:hover {
        background: #2563eb;
        color: #fff;
    }

    .btn-outline-secondary {
        border-radius: 10px;
        border: 1px solid #6b7280;
        color: #6b7280;
        transition: 0.3s;
    }

    .btn-outline-secondary:hover {
        background: #f3f4f6;
        color: #111827;
    }

    @media (max-width: 576px) {
        .d-flex {
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
        }
    }
</style>

<script>
    function generateClassKey() {
        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let key = '';
        for (let i = 0; i < 10; i++) {
            key += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('class_key').value = key;
    }

    // Auto generate key when page loads
    window.onload = generateClassKey;
</script>
{% endblock %}

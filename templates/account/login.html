{% extends 'account/base.html' %}
{% load widget_tweaks %}
{% block title %}Login - Course Craft{% endblock %}
{% block content %}
<style>
    /* Custom animations for a smooth transition effect */
    @keyframes slideInFromLeft {
        0% { transform: translateX(-100%); opacity: 0.3; }
        100% { transform: translateX(0); opacity: 1; }
    }
    
    .animate-in-from-left {
        animation: slideInFromLeft 0.75s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
    
    /* Style for the input fields, adding focus effects */
    input, button {
        transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }
    
    input:focus {
        border-color: #3b82f6; /* blue-500 */
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); /* Blue ring on focus */
        outline: none;
    }
    
    /* Welcome section background gradient */
    .welcome-bg {
        background-image: linear-gradient(135deg, #1f4068 0%, #3b82f6 100%);
        box-shadow: inset 0 0 100px rgba(0,0,0,0.1); /* Inner shadow for depth */
    }
</style>

<div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-blue-100 to-gray-200">
    <div id="container" class="flex w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex-row-reverse bg-white">
        <!-- Login Form Section -->
        <div id="form-section" class="w-1/2 p-8 md:p-12 lg:p-16 bg-white animate-in-from-left">
            <h2 class="text-3xl lg:text-4xl font-extrabold mb-6 text-blue-800">Login</h2>
            <form method="post">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-medium mb-1" for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="w-full border-gray-300 rounded-lg px-4 py-2 focus:border-blue-500 focus:ring-blue-500 focus:outline-none" placeholder="Enter your username" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-1" for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="w-full border-gray-300 rounded-lg px-4 py-2 focus:border-blue-500 focus:ring-blue-500 focus:outline-none" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="w-full mt-8 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">Login</button>
            </form>
            <p class="mt-6 text-center text-blue-600">Don't have an account? <a href="{% url 'register' %}" class="text-blue-800 font-semibold hover:underline">Register</a></p>
            <p class="mt-2 text-center text-blue-600"><a href="{% url 'forgot_password' %}" class="text-blue-800 font-semibold hover:underline">Forgot Password?</a></p>
        </div>
        <!-- Welcome Section -->
        <div id="welcome-section" class="welcome-bg w-1/2 text-white flex flex-col justify-center items-center p-8 text-center">
            <div class="mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 class="text-3xl lg:text-4xl font-extrabold mb-4">Welcome Back!</h2>
            <p class="text-lg lg:text-xl font-light">Log in to continue your journey and access all your courses.</p>
        </div>
    </div>
</div>
{% endblock %}

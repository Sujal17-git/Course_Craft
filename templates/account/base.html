<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Course Craft{% endblock %}</title>
    <!-- Use latest Tailwind CSS CDN for modern features and fixes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font for a clean, professional look -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 antialiased">
    <nav class="bg-blue-700 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'index' %}" class="text-white text-2xl font-bold tracking-wide">Course Craft</a>
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-white hover:text-blue-200 transition-colors duration-200 font-medium">Dashboard</a>
                    <a href="{% url 'logout' %}" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-full shadow-md hover:bg-blue-400 transition duration-300">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-white hover:text-blue-200 transition-colors duration-200 font-medium">Login</a>
                    <a href="{% url 'register' %}" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-full shadow-md hover:bg-blue-400 transition duration-300">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-8 px-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 rounded-lg mb-4 shadow-md
                    {% if message.tags == 'error' %}
                        bg-red-100 border border-red-400 text-red-700
                    {% elif message.tags == 'success' %}
                        bg-green-100 border border-green-400 text-green-700
                    {% else %}
                        bg-blue-100 border border-blue-400 text-blue-700
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
